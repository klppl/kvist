# Builds the Obsidian plugin and attaches it to a GitHub release as
# kvist-plugin.zip: a kvist/ folder to drop into .obsidian/plugins/. The name
# never changes, so the newest version is always at
#   https://github.com/klppl/kvist/releases/latest/download/kvist-plugin.zip
# (When the plugin goes on Obsidian's community list, also upload main.js,
# manifest.json and styles.css loose: Obsidian downloads those.)
#
# Runs for tags like v1.2.3, and by hand (Actions → Plugin release → Run
# workflow) for any tag; a tag that doesn't exist yet is created at the
# commit the workflow runs on. An existing release keeps its notes and gets
# its plugin files replaced.
name: Plugin release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty: v + the version in plugin/manifest.json)"
        required: false

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 # the plugin tests run the Go server
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Pick the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${INPUT_TAG:-v$version}"
          fi
          if [ "${tag#v}" != "$version" ]; then
            echo "::warning::tag $tag does not match plugin/manifest.json version $version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          mkdir -p dist/kvist
          cp main.js manifest.json styles.css dist/kvist/
          (cd dist && zip -r kvist-plugin.zip kvist)

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          # Remove what earlier versions of this workflow uploaded.
          gh release view "$TAG" --json assets --jq '.assets[].name' |
            { grep -E '^(kvist-plugin-.+\.zip|main\.js|manifest\.json|styles\.css)$' || true; } |
            while read -r old; do gh release delete-asset "$TAG" "$old" --yes; done
          gh release upload "$TAG" --clobber dist/kvist-plugin.zip
