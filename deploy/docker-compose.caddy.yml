# kvist behind Caddy (automatic HTTPS). Put this file, Caddyfile and
# kvist.toml in one folder on the server, edit the domain, then:
#   docker compose up -d
#   docker compose exec kvist kvist token create --site garden --name laptop
# Upgrade:
#   docker compose pull && docker compose up -d
services:
  kvist:
    image: ghcr.io/klppl/kvist:latest   # or a pinned tag such as :sha-7822899
    # build: ..                         # instead of image: to build from a checkout
    restart: unless-stopped
    volumes:
      - kvist-data:/data
      - ./kvist.toml:/etc/kvist/kvist.toml:ro
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN:-}  # only for the optional Cloudflare purge
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kvist

volumes:
  kvist-data:
  caddy-data:
  caddy-config:
