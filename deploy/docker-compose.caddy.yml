# kvist behind Caddy, which gets HTTPS certificates on its own. Save this
# file as docker-compose.yml, next to Caddyfile and kvist.toml, put your
# domain in both, then:
#   docker compose up -d
# Upgrade:
#   docker compose pull && docker compose up -d
# See docs/https.html (Domains and HTTPS) for DNS, other proxies and
# several sites.
services:
  kvist:
    image: ghcr.io/klppl/kvist:latest   # or a pinned tag such as :sha-7822899
    # build: ..                         # instead of image: to build from a checkout
    restart: unless-stopped
    volumes:
      - kvist-data:/data
      - ./kvist.toml:/etc/kvist/kvist.toml:ro
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN:-}  # only for the optional Cloudflare purge
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kvist

volumes:
  kvist-data:
  caddy-data:
  caddy-config:
