# kvist config for the Docker setup in deploy/docker-compose.yml.
data_dir = "/data"
listen   = "0.0.0.0:8080"   # inside the container; Caddy is the only thing that reaches it

[[site]]
id       = "garden"
base_url = "https://garden.example.com"
title    = "My garden"
theme    = "garden"
serve    = true

  [site.publish]
  always_public_folders = ["Kvist"]
  exclude_folders       = ["Templates", "Private"]
  expose_frontmatter    = ["stage"]

  # Purge Cloudflare's cache after every build (optional).
  # [site.cloudflare]
  # zone_id       = "your-zone-id"
  # api_token_env = "CF_API_TOKEN"   # token with Zone → Cache Purge only
