# Tests every push and pull request. After the tests pass, the image job
# publishes the server image to GitHub's container registry:
#   ghcr.io/klppl/kvist:latest   pushes to main that change the server
#   ghcr.io/klppl/kvist:sha-…    the same pushes, to pin or roll back
#   ghcr.io/klppl/kvist:1.2.3    tags like v1.2.3 (also 1.2)
# Pushes that only touch docs, the plugin or the example vault build no
# image. Run the workflow by hand (Actions → CI → Run workflow) to build one
# regardless.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: test -z "$(gofmt -l cmd internal themes)"
      - run: go vet ./...
      - run: go test -race ./...

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: [go, plugin]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to compare with the commit before the push

      # Build only when something that goes into the image changed. Tags and
      # manual runs always build; so does a push whose previous commit is
      # unknown (a new branch or a force push).
      - name: Did the server change?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] &&
             git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
              cmd internal themes go.mod go.sum Dockerfile .dockerignore)
            if [ -z "$changed" ]; then
              build=false
              echo "No server files changed since $BEFORE; skipping the image."
            else
              echo "Changed:"; echo "$changed"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.changes.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changes.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64        # add ,linux/arm64 for ARM servers (Hetzner CAX)
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
